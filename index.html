<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ispezioni ponti L1</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b5a8a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#e9eef2;--ink:#14202b;--mut:#5b6b78;--ac:#0b5a8a;--ln:#b9c5cf;--ok:#1d7a46;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}
header h1{font-size:19px;margin:0;flex:1}
header small{opacity:.85}
main{max-width:900px;margin:0 auto;padding:12px}
button{font:inherit;min-height:48px;padding:0 16px;border:1.5px solid var(--ac);background:#fff;color:var(--ac);border-radius:8px}
button.p{background:var(--ac);color:#fff}
header button{background:transparent;color:#fff;border-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.pt{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;gap:12px}
.pt b{flex:1}.pt span{color:var(--mut);font-size:15px}
details{background:var(--card);border:1px solid var(--ln);border-radius:8px;margin:10px 0}
summary{padding:14px;font-weight:700;cursor:pointer;min-height:48px}
.in{padding:4px 14px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.w{grid-column:1/-1}
label{display:block;font-size:15px;color:var(--mut)}
input,textarea{display:block;width:100%;min-height:48px;margin-top:4px;font:inherit;color:var(--ink);padding:8px 10px;border:1.5px solid var(--ln);border-radius:8px;background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #f0a500;outline-offset:1px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.c{border-color:var(--ln);color:var(--ink)}
.c.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.g{border:1px solid var(--ln);border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:end}
.g>b{grid-column:1/-1}
.tb{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--ln);padding:3px;font-size:14px;text-align:left;min-width:92px}
td input{margin:0;min-height:44px}
th:first-child{min-width:150px}
img.f{max-width:100%;max-height:260px;display:block;margin:8px 0;border:1px solid var(--ln)}
#st{font-size:14px}
@media(max-width:600px){.g{grid-template-columns:1fr}}
h3{margin:14px 2px 4px;font-size:16px}
.dr{background:var(--card);border:1px solid var(--ln);border-radius:8px;margin:8px 0;padding:8px 10px}
.dr.on{border-left:6px solid var(--ac)}
.dh{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.dh small{color:var(--mut)}
.gb{background:#e1e8ee;border-radius:6px;padding:2px 8px;font-weight:700}
.c.ps.on{background:#b3261e;border-color:#b3261e}
.dr label{margin-top:6px}
h2{font-size:18px;margin:24px 2px 6px;padding-top:12px;border-top:2px solid var(--ln)}
main>h2:first-child{border:0;margin-top:4px;padding-top:0}
.pt{flex-wrap:wrap}.pt b{min-width:160px}
@media print{header,button,.row{display:none}body{background:#fff}}
.ph{display:flex;gap:8px;margin-top:6px}.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th img{height:72px;border:1px solid var(--ln);border-radius:6px}
#ov{position:fixed;inset:0;background:#000e;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:10px}#ov img{max-width:100%;max-height:72vh}#ov p{margin:8px;text-align:center}
</style></head><body>
<header id="h"></header><main id="m"></main>
<script>
const S=[
{t:'Intestazione',f:[['x','strada','Strada di appartenenza'],['x','km','Progressiva km'],['x','tecnico','Tecnico rilevatore'],['d','data','Data ispezione']]},
{t:'Localizzazione',f:[['x','prov','Provincia/Regione'],['x','comune','Comune'],['x','loc','Località'],['r','crs','Coordinate geografiche',['ETRF2000','WGS84']],['g','centro','Centro'],['g','iniziale','Iniziale'],['g','finale','Finale']]},
{t:'Tipologia strutturale',f:[['m','tipo','Tipologia',['Arco in muratura','Travate appoggiate','Travate continue','Soletta in C.A.','Sezione tubolare in c.a.','Arco in C.A.','Travate Gerber','Cassone in precompresso','Sezione tubolare in acciaio','Arco in acciaio','Strallato o sospeso','Travate in c.a.p. a cavi post-tesi','Altro']],['x','tipo_altro','Altro (specificare)']]},
{t:'Fondazioni e vie di attacco',f:[['m','fond','Tipologia delle fondazioni',['Fondazioni dirette','Fondazioni indirette','Murature','Pile in alveo','Non nota']],['m','vie','Classificazione delle vie di attacco',['Rilevato in terra','Rilevato in terra rinforzata/armata','Rilevato in golena','Su roccia','Viadotto in pendenza/curva','Altro']],['x','vie_altro','Altro (specificare)']]},
{t:'Dati geomorfologici',f:[['r','morf','Morfologia del sito',['Cresta','Pendio dolce (0–10°)','Pendio moderato (10°–25°)','Pendio ripido (>25°)','Pianura','Pianura alla base dei versanti']]]},
{t:'Schemi geometrici',f:[['p','f_tr','Sezione trasversale'],['p','f_lo','Sezione longitudinale'],['p','f_pi','Pianta']]},
{t:'Caratteristiche geometriche',f:[['n','luce_tot','Luce complessiva spalla–spalla [m]'],['n','ncamp','N° campate'],['n','luce_camp','Luce singola campata [m]'],['n','hpile','Altezza max pile [m]'],['n','sbalzo','Lunghezza sbalzo soletta [m]'],['n','largh','Larghezza impalcato dalla sede stradale [m]'],['x','curve','Presenza di curve']]},
{t:'Elementi strutturali',f:[['T','mat','Materiale × tipologia elementi',['C.A.','C.A.P.','Acciaio','Acciaio–Calcestruzzo','Muratura','Legno','Altro'],['Spalle (n° elementi)','Pile (n° elementi)','Impalcato (n° campate)']],['T','imp','Elementi dell\u2019impalcato',['Soletta [n° campate]','Travi [n° elementi]','Traversi [n° elementi]','Arco [n° elementi]','Altro'],['Totali','C.A.','C.A.P.','Acciaio','Acciaio–Calcestruzzo','Muratura','Legno','Altro']]]},
{t:'Apparecchi di appoggio',f:[['r','app','Apparecchi',['Assenti','Presenti']],['x','app_tipo','Tipo di apparecchi'],['n','app_tot','N° apparecchi totali'],['n','app_ril','N° apparecchi rilevabili'],['m','app_nv','',['Nessun apparecchio visibile']]]},
{t:'Elementi critici (§ 3.3 Linee Guida)',f:[['r','crit','Elementi critici',['Assenti','Presenti']],['x','crit_tipo','Tipologia di elemento'],['a','crit_deg','Stato di degrado (descrizione sintetica)']]},
{t:'Informazioni ispezione',f:[['r','acc','Possibilità di accedere al di sotto del ponte',['Sì','No','Parziale']],['n','acc_camp','Se parziale: n° campate completamente ispezionate'],['r','prosp','Ispezionati entrambi i prospetti',['Sì','No']],['x','prosp_n','Prospetto ispezionato']]}
];
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const idb=new Promise(r=>{const q=indexedDB.open('ponti_l1',2);q.onupgradeneeded=()=>{const d=q.result;['p','f'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};q.onsuccess=()=>r(q.result)});
const tx=async(mode,f,st='p')=>{const d=await idb;return new Promise(r=>{const q=f(d.transaction(st,mode).objectStore(st));q.onsuccess=()=>r(q.result)})};
const put=p=>tx('readwrite',s=>s.put(p,p.id)),all=()=>tx('readonly',s=>s.getAll()),del=id=>tx('readwrite',s=>s.delete(id));
let cur=null,timer,ctx=null,view='home';const X=()=>ctx||cur;
const cnt=p=>Object.values(p.v).filter(x=>Array.isArray(x)?x.length:x).length;
const V=k=>X().v[k];
const inp=(k,l,ty='text',x='')=>`<label>${l}<input data-k="${k}" type="${ty}" ${x} value="${E(V(k))}"></label>`;
const chips=(k,o,multi)=>`<div class="ch">${o.map(x=>{const v=V(k);const on=multi?(v||[]).includes(x):v===x;return `<button type="button" class="c${on?' on':''}" data-a="${multi?'m':'r'}" data-k="${k}" data-o="${E(x)}">${x}</button>`}).join('')}</div>`;
function fld([t,k,l,o,c]){
 if(t=='x')return `<div>${inp(k,l)}</div>`;
 if(t=='n')return `<div>${inp(k,l,'text','inputmode="decimal"')}</div>`;
 if(t=='d')return `<div>${inp(k,l,'date')}</div>`;
 if(t=='a')return `<div class="w"><label>${l}<textarea rows="3" data-k="${k}">${E(V(k))}</textarea></label></div>`;
 if(t=='r'||t=='m')return `<div class="w">${l?`<label>${l}</label>`:''}${chips(k,o,t=='m')}</div>`;
 if(t=='g')return `<div class="w g"><b>${l}</b>${inp(k+'_q','Quota s.l.m. [m]','text','inputmode="decimal"')}${inp(k+'_lon','Longitudine','text','inputmode="decimal"')}${inp(k+'_lat','Latitudine','text','inputmode="decimal"')}<button type="button" data-a="gps" data-k="${k}">Usa GPS</button></div>`;
 if(t=='p')return `<div class="w"><label>${l}</label>${V(k)?`<img class="f" src="${V(k)}">`:''}<div class="row"><label><button type="button" class="p" onclick="this.nextElementSibling.click()">${V(k)?'Sostituisci foto':'Scatta o scegli foto'}</button><input type="file" accept="image/*" data-p="${k}" hidden></label>${V(k)?`<button type="button" data-a="rp" data-k="${k}">Rimuovi</button>`:''}</div></div>`;
 if(t=='T')return `<div class="w"><label>${l}</label><div class="tb"><table><tr><th></th>${c.map(x=>`<th>${x}</th>`).join('')}</tr>${o.map((r,i)=>`<tr><th>${r}</th>${c.map((_,j)=>`<td><input inputmode="numeric" data-k="${k}|${i}|${j}" value="${E(V(`${k}|${i}|${j}`))}"></td>`).join('')}</tr>`).join('')}</table></div></div>`;
}
async function home(){
 cur=null;view='home';ctx=null;const A=(await all()).sort((a,b)=>a.name.localeCompare(b.name,'it',{numeric:true})),ps=A.filter(p=>p.t!='l2'),p2=A.filter(p=>p.t=='l2');
 $('h').innerHTML=`<h1>Ispezioni ponti</h1><small>${ps.length} L1 · ${p2.length} L2</small>`;
 $('m').innerHTML=`<h2>Livello 1 – Ispezione ponti</h2><div class="row"><button class="p" data-a="new">Nuovo ponte</button><button data-a="exp">Esporta tutto (JSON)</button><button onclick="document.getElementById('imp').click()">Importa JSON</button><input id="imp" type="file" accept=".json,.txt" hidden></div>`+
 (ps.length?ps.map(p=>`<div class="pt"><b>${E(p.name)}</b><span>${cnt(p)} campi compilati</span><button class="p" data-a="open" data-id="${p.id}">Apri</button><button data-a="del" data-id="${p.id}">Elimina</button></div>`).join(''):'<p>Nessun ponte. Tocca «Nuovo ponte» per creare la prima scheda.</p>')+
 `<h2>Livello 2 – Schede difettologiche</h2><div class="row"><button class="p" data-a="new2">Nuovo ponte (L2)</button><button data-a="exp2">Esporta tutto L2 (JSON)</button><button onclick="document.getElementById('imp2').click()">Importa JSON</button><input id="imp2" type="file" accept=".json,.txt" hidden></div>`+
 (p2.length?p2.map(p=>`<div class="pt"><b>${E(p.name)}</b><span>${(p.d||[]).length} schede</span><button class="p" data-a="o2" data-id="${p.id}">Apri</button><button data-a="del" data-id="${p.id}">Elimina</button></div>`).join(''):'<p>Nessun ponte per il livello 2. Tocca «Nuovo ponte (L2)».</p>');
}
function form(){view='form';ctx=null;
 $('h').innerHTML=`<button data-a="back">‹ Elenco</button><h1>${E(cur.name)}</h1><small id="st">Salvato</small><button data-a="expone">Esporta ponte</button>`;
 $('m').innerHTML=S.map((s,i)=>`<details ${i<2?'open':''}><summary>${s.t}</summary><div class="in">${s.f.map(fld).join('')}</div></details>`).join('');
}
const dirty=()=>{$('st').textContent='Salvataggio…';clearTimeout(timer);timer=setTimeout(async()=>{await put(cur);$('st').textContent='Salvato'},300)};
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k&&cur){X().v[k]=e.target.value;dirty()}});
document.addEventListener('change',async e=>{
 const ph=e.target.dataset.ph;if(ph&&e.target.files[0]){const f=e.target.files[0],T=e.target.dataset;e.target.value='';try{await addFoto(ph,T.d,T.c,f)}catch(x){alert('Foto non salvata: '+x.message)}return}
 const k=e.target.dataset.p;
 if(k&&e.target.files[0]){const b=await createImageBitmap(e.target.files[0]);const s=Math.min(1,1000/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);X().v[k]=c.toDataURL('image/jpeg',.7);await put(cur);keep(render)}
 if((e.target.id=='imp'||e.target.id=='imp2')&&e.target.files[0]){try{const j=JSON.parse(await e.target.files[0].text());let n=0;for(const p of j.ponti){if(p.t=='l2'){const o=await tx('readonly',q=>q.get(p.id));if(o){const m=new Map((o.d||[]).map(x=>[x.id,x]));(p.d||[]).forEach(x=>m.set(x.id,x));p.d=[...m.values()]}}await put(p);n++}alert('Importati '+n+' ponti')}catch(x){alert('File non valido')}e.target.value='';home()}
});
const dlf=async(t,n,ty)=>{const u=URL.createObjectURL(new Blob([t],{type:ty}));const l=document.createElement('a');l.href=u;l.download=n;l.click();
 if(navigator.share&&navigator.canShare){for(const f of [new File([t],n,{type:ty}),new File([t],n+'.txt',{type:'text/plain'})]){if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:n})}catch(e){}break}}}};
const dl=(ps,n)=>dlf(JSON.stringify({versione:1,esportato:new Date().toISOString(),schema:S,ponti:ps}),n,'application/json');
const keep=f=>{const y=scrollY;f();scrollTo(0,y)};
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
 if(a=='new'){const n=prompt('Nome o sigla del ponte');if(n){cur={id:Date.now().toString(36),name:n,v:{}};await put(cur);form()}}
 else if(a=='open'){cur=(await tx('readonly',s=>s.get(b.dataset.id)));form()}
 else if(a=='del'){if(confirm('Eliminare questa scheda?')){await del(b.dataset.id);await tx('readwrite',s=>s.delete(IDBKeyRange.bound(b.dataset.id+'|',b.dataset.id+'|\uffff')),'f');home()}}
 else if(a=='back'){await put(cur);home()}
 else if(a=='r'){X().v[k]=X().v[k]===b.dataset.o?'':b.dataset.o;b.parentNode.querySelectorAll('.c').forEach(x=>x.classList.toggle('on',X().v[k]===x.dataset.o));dirty();if(b.dataset.rr)keep(render)}
 else if(a=='m'){const l=X().v[k]||[],o=b.dataset.o;X().v[k]=l.includes(o)?l.filter(x=>x!=o):[...l,o];b.classList.toggle('on');dirty()}
 else if(a=='ej'||a=='ec'){const L=b.dataset.id?cur.d.filter(x=>x.id==b.dataset.id):cur.d.filter(compiled);if(!L.length){alert('Nessuna scheda compilata da esportare');return}
  const sf=t=>String(t||'').replace(/[^\w-]+/g,'_'),nm=sf(cur.name)+(b.dataset.id?'_sch'+L[0].s+(L[0].v.n?'-'+sf(L[0].v.n):''):'');
  if(a=='ej')dl([{...cur,d:L}],'difetti_'+nm+'.json');else dlf(csv(cur,L),'difetti_'+nm+'.csv','text/csv')}
 else if(a=='new2'){const n=prompt('Nome o sigla del ponte (livello 2)');if(n){cur={id:Date.now().toString(36),t:'l2',name:n,v:{},d:[]};await put(cur);dif()}}
 else if(a=='o2'){cur=await tx('readonly',q=>q.get(b.dataset.id));dif()}
 else if(a=='exp2'){dl((await all()).filter(p=>p.t=='l2'),'schede_difetti_'+new Date().toISOString().slice(0,10)+'.json')}
 else if(a=='ez'){await expZip()}
 else if(a=='fv'){const r=await tx('readonly',s=>s.get(cur.id+'|'+b.dataset.n),'f');if(!r)return;const u=URL.createObjectURL(r.b),o=document.createElement('div');o.id='ov';o.dataset.u=u;o.innerHTML=`<img src="${u}"><p><b>${E(r.n)}</b> · ${E(capOf(r))}</p><div class="row"><button data-a="fx">Chiudi</button><button data-a="fd" data-n="${r.n}">Elimina foto</button></div>`;document.body.appendChild(o)}
 else if(a=='fx'){const o=$('ov');if(o){URL.revokeObjectURL(o.dataset.u);o.remove()}}
 else if(a=='fd'){const n=b.dataset.n;if(confirm('Eliminare la foto '+n+'?')){const r=await tx('readonly',s=>s.get(cur.id+'|'+n),'f');await tx('readwrite',s=>s.delete(cur.id+'|'+n),'f');const d=r&&cur.d.find(x=>x.id==r.sid);if(d&&d.v[r.k])d.v[r.k]=String(d.v[r.k]).split(/\s*[,;]\s*/).filter(t=>t&&t.padStart(3,'0')!=n).join(', ');await put(cur);const o=$('ov');if(o){URL.revokeObjectURL(o.dataset.u);o.remove()}if(view=='sch')keep(render)}}
 else if(a=='cda'){await put(cur);cda()}
 else if(a=='backc'){dif()}
 else if(a=='prn'){print()}
 else if(a=='ecda'){const R=calcCdA(),o=[['ponte','passaggio','risultato','dettaglio']];R.S.forEach(s=>o.push([cur.name,s.n,s.val,s.det]));R.M.forEach(m=>o.push([cur.name,'DATO MANCANTE',m,'']));R.W.forEach(w=>o.push([cur.name,'AVVISO',w,'']));dlf('\ufeff'+o.map(r=>r.map(qc).join(';')).join('\r\n'),'cda_'+cur.name.replace(/[^\w-]+/g,'_')+'.csv','text/csv')}
 else if(a=='back2'){await put(cur);form()}
 else if(a=='add'){const d={id:Date.now().toString(36),s:+b.dataset.s,v:{}};cur.d.push(d);await put(cur);ctx=d;sch()}
 else if(a=='os'){ctx=cur.d.find(x=>x.id==b.dataset.id);sch()}
 else if(a=='ds'){if(confirm('Eliminare questa scheda?')){cur.d=cur.d.filter(x=>x.id!=b.dataset.id);await put(cur);dif()}}
 else if(a=='back3'){await put(cur);dif()}
 else if(a=='allnp'){const n=CAT[ctx.s].r.filter(Array.isArray).length;for(let i=0;i<n;i++)if(!ctx.v['r'+i])ctx.v['r'+i]='np';await put(cur);keep(render)}
 else if(a=='rp'){delete X().v[k];await put(cur);keep(render)}
 else if(a=='gps'){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{X().v[k+'_lon']=p.coords.longitude.toFixed(6);X().v[k+'_lat']=p.coords.latitude.toFixed(6);if(p.coords.altitude!=null)X().v[k+'_q']=p.coords.altitude.toFixed(1);dirty();keep(render)},er=>alert('GPS non disponibile: '+er.message+'. Inserisci le coordinate a mano.'),{enableHighAccuracy:true,timeout:20000}):alert('GPS non supportato')}
 else if(a=='exp'){dl((await all()).filter(p=>p.t!='l2'),'ponti_'+new Date().toISOString().slice(0,10)+'.json')}

   [['g.','Guardiavia'],['p.','Parapetto']].forEach(([p,nm])=>{BL.concat([['pg','Presente come guardiavia'],['pp','Presente come parapetto']]).forEach(([k,l])=>v[p+k]&&row(nm,l,'','presente','','','',v[p+k+'.f']));v[p+'h']&&row(nm,'Altezza (cm)','',v[p+'h'])});
  }else{let i=-1;CAT[d.s].r.forEach(r=>{if(!Array.isArray(r))return;i++;const s=v['r'+i];if(!s)return;
   row(r[0],r[1],r[2],ST[s],s=='v'?kv('r'+i+'.a'):'',s=='v'?kv('r'+i+'.b'):'',v['r'+i+'.p']?'PS':'',v['r'+i+'.f'],v['r'+i+'.n'])})}

const num=s=>{const x=parseFloat(String(s??'').replace(',','.'));return isNaN(x)?null:x},c4=n=>Math.max(0,Math.min(4,n));
const normaCl=(c,y,L)=>{const big=L>=10;if(y<(c=='I'?1952:1990))return['A',''];if(y<=(big?2005:1990))return['B',''];if(y>=(big?2008:2005))return['C',''];return['B','Anno di progetto in un intervallo non coperto dalle LG: assunta classe B (cautelativa)']};
function calcCdA(){
 const v=cur.v,S=[],W=[],M=[],st=(n,val,det)=>S.push({n,val,det:det||''});
 const kel=num(v.cl_kel)||1,nel=num(v.cl_nel)||6,SC=(cur.d||[]).filter(d=>d.s!=20&&CAT[d.s]);
 let dl=null,G3=0;const wh=[];
 // 1. livello di difettosità (Tab. 4.5)
 if(!SC.length)M.push('Schede difetti compilate');
 else{dl=0;SC.forEach(d=>{
  const nm=d.s+' · '+NM(d.s)+(d.v.n?' · '+d.v.n:''),rows=CAT[d.s].r.filter(Array.isArray);let nc=0,nr=0;
  if(!d.v.n)W.push('Scheda '+d.s+' senza N° elemento');
  if(d.v.cond=='1'){dl=4;wh.push([4,nm+': condizione critica in atto'])}
  rows.forEach((r,i)=>{const s=d.v['r'+i];if(!s){nc++;return}if(s=='nr'&&r[2]>=4)nr++;if(s!='v')return;
   const g=r[2],a=d.v['r'+i+'.a'],b=d.v['r'+i+'.b'],no=x=>x==null||x==='';
   if((/1/.test(r[3])&&no(a))||(/1/.test(r[4])&&no(b)))W.push(nm+': «'+r[1]+'» senza K1/K2'+(g>=4?' (K2 mancante: assunta elevata)':''));
   const k=no(b)?(g>=4?1:.2):[.2,.5,1][b],el=k>=kel,ps=d.v['r'+i+'.p']=='1',crit=d.v.crit=='1'||r[0]=='Ril/Fond_1';
   if(g<=3){G3++;return}
   const l=crit?4:el&&ps?3:el?2:g==5?2:1;
   wh.push([l,nm+': '+r[1]+' (G'+g+', K2 '+String(k).replace('.',',')+')'+(crit?', elemento critico':'')+(ps?', PS':'')]);dl=Math.max(dl,l)});
  if(nc)W.push(nm+': '+nc+' righe non compilate');
  if(nr)W.push(nm+': '+nr+' difetti G≥4 non rilevabili: verificare gli elementi critici (§ 3.3)')});
  if(G3>=nel){dl=Math.max(dl,1);wh.push([1,G3+' difetti G≤3 visti (soglia '+nel+')'])}
  st('Livello di difettosità',LDF[dl],wh.sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1]).join(' | ')||'nessun difetto significativo')}
 // 2. vulnerabilità (Fig. 4.2)
 const L=num(v.cl_lmax),Lm=num(v.cl_lmed),nc=num(v.cl_nc),ya=num(v.cl_anno),yi=num(v.cl_anno_int),y=yi||ya;let vul=null;
 if(dl==4){vul=4;st('Vulnerabilità','Alta','difettosità ALTO: vulnerabilità ALTA a prescindere dagli altri fattori')}
 else if(dl!=null){
  const sc=[[v.cl_t,v.cl_m],[v.cl_t2,v.cl_m2]].filter(x=>x[0]).map(([t,m])=>{const r=T46[t]&&T46[t][m];return r&&L!=null&&nc!=null?c4(+r[L<=5?0:L<15?1:L<25?2:3]+(nc>3?1:0)):null}).filter(x=>x!=null);
  let nor=v.cl_nor?[v.cl_nor,'impostata a mano']:null;
  if(!nor){const yp=num(v.cl_aprog)??ya;if(yp!=null&&L!=null){nor=normaCl(v.cl_cat=='I'?'I':'II',yp,L);
   if(num(v.cl_aprog)==null)W.push('Anno di progetto non indicato: per la norma è usato l\'anno di costruzione');
   if(v.cl_cat!='I'&&v.cl_cat!='II')W.push('Categoria di progetto non indicata: assunta 2ª categoria (LG)');
   if(nor[1])W.push(nor[1])}}
  if(y==null)M.push('Anno di costruzione (o dell\'ultimo intervento significativo)');
  if(!sc.length)M.push('Schema statico, materiale, luce della campata più lunga e n° campate');
  if(!nor)M.push('Anno di progetto o di costruzione, e luce della campata più lunga (norma di progettazione)');
  if(y!=null&&sc.length&&nor){
   const r=y<=1945?0:y>=1980?2:1,s0=Math.max(...sc);let a=dl;
   if(dl>0&&dl<4){if(r==2)a=dl+1;else if(r==0&&dl!=3)a=dl-1}
   const a1=a;if(a>0&&a<4)a+=nor[0]=='A'?1:nor[0]=='C'?-1:0;
   vul=MV[a][s0];
   st('Rapidità di evoluzione del degrado',LDF[a1],(yi?'ultimo intervento ':'costruzione ')+y+' → '+['≤ 1945','1945-1980','≥ 1980'][r]);
   st('Norma di progettazione',LDF[a],'classe '+nor[0]+(nor[1]?' ('+nor[1]+')':''));
   st('Schema statico, materiale, luce',LVL[s0],'Tab. 4.6'+(nc>3?' (+1 livello: più di 3 campate)':'')+(sc.length>1?' (più gravoso tra i due schemi)':''));
   st('Vulnerabilità',LVL[vul])}}
 // 3. pericolosità (Tab. 4.3-4.4)
 let pe=null;const vc=num(v.cl_vc);
 if(v.cl_str&&vc!=null){const f=vc>=700?0:vc>300?1:2;pe=T43[v.cl_str][f];st('Pericolosità',LVL[pe],'classe stradale '+v.cl_str+', '+vc+' veicoli commerciali/giorno per corsia (frequenza '+['alta','media','bassa'][f]+')')}
 else M.push('Classe stradale e veicoli commerciali/giorno per corsia');
 // 4. esposizione (Tab. 4.7-4.8, Fig. 4.3)
 let es=null;const tg=num(v.cl_tgm);
 if(tg!=null&&Lm!=null&&v.cl_ente){
  let e=T48[Lm>50?0:Lm>20?1:2][tg>=25000?0:tg>10000?1:2];const e0=e;
  if(v.cl_ped=='1')e=c4(e+1);
  if(v.cl_alt!='P')e=c4(e+1);
  if(!v.cl_alt)W.push('Alternative stradali non indicate: assunta assenza (cautelativa)');
  es=c4(e+{A:1,M:0,B:-1}[v.cl_ente]);
  st('Esposizione',LVL[es],'TGM '+tg+', luce media '+Lm+' m → '+LVL[e0]+(v.cl_ped=='1'?'; +1 pedoni':'')+'; alternative '+(v.cl_alt=='P'?'presenti':'assenti')+'; ente scavalcato '+{A:'alta',M:'media',B:'bassa'}[v.cl_ente])}
 else M.push('TGM, luce media delle campate ed ente scavalcato');
 if(v.cl_mp=='1')st('Merci pericolose','Sì','non cambia la classe: priorità più alta tra ponti della stessa classe');
 let cda=null;
 if(pe!=null&&vul!=null&&es!=null){cda='BbMaA'.indexOf(MX[pe][4-vul][4-es]);st('Classe di attenzione strutturale e fondazionale',LVL[cda].toUpperCase(),'Tab. 4.10')}
 return{S,W,M,cda}}

 sm=(a,b)=>`<label>Schema statico</label>${cp(a,Object.keys(T46).map(x=>[x,x]),1)}${V(a)&&T46[V(a)]?`<label>Materiale dell’impalcato</label>${cp(b,Object.keys(T46[V(a)]).map(x=>[x,x]),1)}`:''}`;
 return `<details><summary>Dati per la classificazione (CdA strutturale e fondazionale)</summary><div class="in">

${inp('cl_vc','Veicoli commerciali/giorno per corsia','text',I)}${inp('cl_tgm','TGM veicoli/giorno (intera carreggiata)','text',I)}

<div class="w"><label>Frequente transito di pedoni (marciapiedi, centro abitato)</label>${yn('cl_ped')}</div>
<div class="w"><label>Trasporto merci pericolose non occasionale</label>${yn('cl_mp')}</div>
${inp('cl_kel','Convenzione: K2 «elevata» se ≥ (0,5 oppure 1)','text',N)}${inp('cl_nel','Convenzione: n° difetti G≤3 che valgono «numero elevato»','text',I)}
</div></details>`};
function cda(){
 view='cda';ctx=null;scrollTo(0,0);const R=calcCdA(),li=a=>a.length?'<ul>'+a.map(x=>`<li>${E(x)}</li>`).join('')+'</ul>':'';
 $('h').innerHTML=`<button data-a="backc">‹ Schede</button><h1>CdA · ${E(cur.name)}</h1>`;
 $('m').innerHTML=`<div class="row"><button class="p" data-a="ecda">Esporta CSV</button><button data-a="prn">Stampa / PDF</button></div>`+
 (R.cda!=null?`<div class="pt"><b style="font-size:21px">CdA strutturale e fondazionale: ${LVL[R.cda].toUpperCase()}</b></div>`:`<div class="pt"><b>CdA non calcolabile: mancano dei dati</b></div>`)+
 (R.M.length?'<h3>Dati mancanti</h3>'+li(R.M):'')+
 `<div class="tb"><table><tr><th>Passaggio</th><th>Risultato</th><th>Dettaglio</th></tr>${R.S.map(s=>`<tr><th>${E(s.n)}</th><td><b>${E(s.val)}</b></td><td>${E(s.det)}</td></tr>`).join('')}</table></div>`+
 (R.W.length?'<h3>Avvisi</h3>'+li(R.W):'')+
 `<p><small>Calcolo secondo le Linee Guida (DM 204/2022) § 4.2, Tab. 4.3-4.10 e Fig. 4.2-4.3. Il livello di difettosità usa le convenzioni indicate nei dati di classificazione: è una proposta da verificare dal tecnico.</small></p>`}

const FMAX=1600; // lato massimo in px delle foto salvate
const phb=(k,d,c)=>{const a=`data-ph="${k}" data-d="${E(d)}" data-c="${E(c||'')}"`;return `<div class="ph"><button type="button" class="c" onclick="this.parentNode.children[2].click()">📷 Scatta</button><button type="button" class="c" onclick="this.parentNode.children[3].click()">Galleria</button><input type="file" accept="image/*" capture="environment" hidden ${a}><input type="file" accept="image/*" hidden ${a}></div><div class="th" data-th="${k}"></div>`};
const listF=pid=>tx('readonly',s=>s.getAll(IDBKeyRange.bound(pid+'|',pid+'|\uffff')),'f');

const shrink=(b,m,q)=>{const s=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c};

async function fillTh(){
 const E1=[...document.querySelectorAll('[data-th]')];if(!E1.length||!cur)return;
 const M=new Map((await listF(cur.id)).map(r=>[r.n,r]));
 E1.forEach(el=>{el.innerHTML=(String(X().v[el.dataset.th]||'').match(/\d+/g)||[]).map(t=>M.get(t.padStart(3,'0'))).filter(Boolean).map(r=>`<img src="${r.t}" data-a="fv" data-n="${r.n}" alt="foto ${r.n}">`).join('')})}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zipBlob(files){
 const enc=new TextEncoder(),P=[],C=[];let off=0;
 for(const f of files){const nm=enc.encode(f.n),c=crc32(f.d),z=f.d.length,h=new DataView(new ArrayBuffer(30)),e=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,z,true);h.setUint32(22,z,true);h.setUint16(26,nm.length,true);
  e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,z,true);e.setUint32(24,z,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  P.push(h.buffer,nm,f.d);C.push(e.buffer,nm);off+=30+nm.length+z}
 const cs=C.reduce((a,x)=>a+x.byteLength,0),t=new DataView(new ArrayBuffer(22));
 t.setUint32(0,0x06054b50,true);t.setUint16(8,files.length,true);t.setUint16(10,files.length,true);t.setUint32(12,cs,true);t.setUint32(16,off,true);
 return new Blob([...P,...C,t.buffer],{type:'application/zip'})}
